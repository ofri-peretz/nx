name: Gradle cache setup pilot

on:
  push:
    branches:
      - test/gradle-cache-setup-pilot-20261123

permissions:
  contents: read

jobs:
  graph-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: '22.23.4'
      COREPACK_DEFAULT_TO_LATEST: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up nightly tools
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        with:
          cache: 'false'

      - name: Install repository dependencies
        run: |
          npm install -g npm@11.12.0 --ignore-scripts
          npm install -g corepack@0.35.0 --ignore-scripts
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          dotnet restore nx.sln

      - name: Compare online and cache-only Gradle inference
        shell: bash
        run: bash .github/workflows/nightly/gradle-cache-graph-pilot.sh
